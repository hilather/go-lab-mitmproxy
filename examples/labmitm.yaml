# mcp-integration-lab overlay: copy to profiles/default/labmitm/bootstrap.yaml
# and mount at /etc/labmitm/config.yaml. Not the DEP-001 compose-smoke
# bootstrap (that file is testdata/container/config.yaml). allowLegacyClients
# is on so MCPJungle can register without a LabMITM patch (D15). Published
# binds :8888/:8088 (lab AGENTS.md rule 5). allowHosts is the recommended
# lab set (*.lab + compose DNS names). Bind-mounted secret files must be
# 0o644 (UID 65532). Catalog id is labmitm. Do not claim the lab already
# runs LabMITM — compose-in is a follow-on lab PR (D18).
apiVersion: labmitm.dev/v1alpha1
kind: LabMITM
metadata:
  name: lab-proxy
spec:
  listeners:
    proxy:
      address: ":8888"
    management:
      address: ":8088"
      restPath: /v1
      mcpPath: /mcp
      tls:
        enabled: false
        certFile: ""
        keyFile: ""

  proxy:
    hostname: labmitm.lab
    admission:
      maxSessions: 256
      maxSessionsPerIP: 32
      maxInFlight: 64
      maxInFlightBytes: 64MiB
      sessionTimeout: 10m
      idleTimeout: 120s
      headerTimeout: 10s
      dialTimeout: 10s
      upstreamTimeout: 60s
    targets:
      denyCloudMetadata: true
      denyLinkLocal: true
      allowLoopback: true
      allowHosts:
        - "*.lab"
        - labdns
        - labldap
        - labtacacs
        - labinfo
        - maildev
        - mcpjungle
      denyHosts: []

  tls:
    intercept: true
    hosts: []
    ports: [443]
    ca:
      mode: generate
      certFile: ""
      keyFile: ""
    upstream:
      insecureSkipVerify: false
      extraCAFiles: []

  rules:
    enabled: false
    items: []

  store:
    maxFlows: 1000
    maxBytes: 256MiB
    maxBodyBytes: 1MiB
    fullPolicy: reject
    maxWait: 60s
    spillDirectory: ""
    spillThreshold: 256KiB

  ui:
    enabled: true

  management:
    auth:
      mode: bearer
      tokens:
        - id: admin
          secretFile: /run/secrets/labmitm-token
          role: administrator
          scopes: [mitm.read, mitm.write, mitm.admin, mitm.audit.read]
    mcp:
      allowLegacyClients: true
    originAllowlist: []
    bodyLimit: 1MiB
    requestsPerSecond: 32
    burst: 64
    maxConcurrent: 256

  observability:
    logLevel: info
    metrics:
      listen: "127.0.0.1:9090"
      publicPath: false
    audit:
      ring: 128
