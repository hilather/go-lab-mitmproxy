# Disabled HTTP auth may still list users (paths hashed; files must exist at Start).
apiVersion: labmitm.dev/v1alpha1
kind: LabMITM
metadata:
  name: lab-proxy
spec:
  proxy:
    httpAuth:
      enabled: false
      users:
        - id: lab-proxy
          usernameFile: testdata/config/valid/socks-username
          passwordFile: testdata/config/valid/socks-password
