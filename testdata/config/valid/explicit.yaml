apiVersion: labmitm.dev/v1alpha1
kind: LabMITM
metadata:
  name: lab-proxy
  labels:
    env: lab
spec:
  listeners:
    proxy:
      address: "127.0.0.1:8888"
    management:
      address: "127.0.0.1:8088"
      restPath: /v1
      mcpPath: /mcp
      tls:
        enabled: false
        certFile: ""
        keyFile: ""
  proxy:
    hostname: labmitm.lab
    admission:
      maxSessions: 256
      maxSessionsPerIP: 32
      maxInFlight: 64
      maxInFlightBytes: 64MiB
      sessionTimeout: 10m
      idleTimeout: 120s
      headerTimeout: 10s
      dialTimeout: 10s
      upstreamTimeout: 60s
    targets:
      denyCloudMetadata: true
      denyLinkLocal: true
      allowLoopback: true
      allowHosts: []
      denyHosts: []
  tls:
    intercept: false
    hosts: []
    ports: [443]
    ca:
      mode: generate
      certFile: ""
      keyFile: ""
    upstream:
      insecureSkipVerify: false
      extraCAFiles: []
  rules:
    enabled: false
    items: []
  store:
    maxFlows: 1000
    maxBytes: 256MiB
    maxBodyBytes: 1MiB
    fullPolicy: reject
    maxWait: 60s
    spillDirectory: ""
    spillThreshold: 256KiB
  ui:
    enabled: true
  management:
    auth:
      mode: bearer
      tokens: []
    mcp:
      allowLegacyClients: false
    originAllowlist: []
    bodyLimit: 1MiB
    requestsPerSecond: 32
    burst: 64
    maxConcurrent: 256
  observability:
    logLevel: info
    metrics:
      listen: "127.0.0.1:9090"
      publicPath: false
    audit:
      ring: 128
