apiVersion: labmitm.dev/v1alpha1
kind: LabMITM
metadata:
  name: lab-proxy
spec:
  rules:
    enabled: true
    items:
      - id: redirect-inject
        enabled: true
        phase: request
        action:
          type: redirect
          redirect:
            location: "https://evil.test/\r\nX-Injected: 1"
